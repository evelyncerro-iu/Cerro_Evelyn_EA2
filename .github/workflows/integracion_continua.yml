name: Pipeline de Integracion Continua (CI)

on:
  push:
    branches:
      - main
      - desarrollo
  pull_request:
    branches:
      - main
      - desarrollo

jobs:
  verificacion-calidad-y-pruebas:
    name: Verificacion de Codigo y Pruebas Unitarias
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version-python: ["3.11", "3.12"]

    steps:
      - name: Descargar codigo fuente del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno de Python ${{ matrix.version-python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.version-python }}
          cache: "pip"

      - name: Instalar dependencias del proyecto
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar analisis estatico de codigo con Flake8 (Linter)
        run: |
          python -m flake8 modulos pruebas principal.py --max-line-length=100

      - name: Ejecutar pruebas unitarias automatizadas con Pytest
        run: |
          python -m pytest -v --tb=short
